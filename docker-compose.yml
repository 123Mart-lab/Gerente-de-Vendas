version: '3.8'

services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:v0.23.1
    container_name: 123mart_openwa
    restart: unless-stopped
    ports:
      - "2785:2785" # Porta unificada para API REST, Webhooks e Dashboard
    environment:
      - ENGINE_TYPE=whatsapp-web.js # Escolha arquitetural: Motor com Chromium (menor risco de banimento)
      - NODE_ENV=production
    volumes:
      - openwa_data:/app/data # Persistência de dados (SQLite, Sessões, Logs)

  redis:
    image: redis:7-alpine
    container_name: 123mart_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  openwa_data:
    name: 123mart_openwa_data
  redis_data:
    name: 123mart_redis_data
